name: Snap CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-snap:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        sudo snap install --classic snapcraft
        sudo snap install --classic lxd

    - name: Wait for snapd
      run: sudo snap wait system seed.loaded

    - name: Configure LXD and restart snapd
      run: |
        sudo lxd init --auto
        sudo usermod -a -G lxd $USER
        sudo systemctl restart snapd

    - name: Pre-install build dependencies with retries
      run: |
        # snapcraft runs unprivileged in destructive mode, so every build snap the
        # gnome extension needs (including mesa-2404 for its gpu-2404 part) must
        # be installed up front with sudo.
        for snap in core24 gtk-common-themes gnome-46-2404-sdk gnome-46-2404 mesa-2404; do
          echo "--- Installing $snap ---"
          for i in 1 2 3; do
            if sudo snap install "$snap"; then
              echo "$snap installed successfully."
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Failed to install $snap after 3 attempts."
              exit 1
            fi
            echo "Failed to install $snap, retrying in 10 seconds..."
            sleep 10
          done
        done

    - name: Build the snap
      # Build in destructive mode and print logs on failure.
      run: |
        snapcraft --destructive-mode || (cat /home/runner/.local/state/snapcraft/log/snapcraft-*.log && exit 1)

    - name: Install the snap
      run: |
        sudo snap install --dangerous lxd-indicator_*.snap
        sleep 10 # Give snapd time to process the new snap's interfaces
        sudo snap connect lxd-indicator:lxd lxd
        sudo snap connect lxd-indicator:gnome-46-2404 gnome-46-2404 || true
        sudo snap connect lxd-indicator:gpu-2404 mesa-2404 || true
        snap connections lxd-indicator
        ls -l /snap/lxd-indicator/current/usr/bin/python3* || true
        ls /snap/lxd-indicator/current/lib/python3/site-packages || true

    - name: Test the snap
      run: |
        set -x
        # Give the runner user a real systemd user session and session bus.
        # `snap run` creates a transient systemd scope over the session bus
        # for every launch, so a bare dbus-run-session (or a fake
        # org.freedesktop.systemd1 service) leaves it stuck or failing.
        sudo loginctl enable-linger "$USER"
        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        for i in $(seq 1 30); do
          [ -S "$XDG_RUNTIME_DIR/bus" ] && break
          sleep 1
        done
        ls -l "$XDG_RUNTIME_DIR"
        export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
        export GDK_BACKEND=x11

        # Start the app with the lxd group, which this job's shell lacks.
        sg lxd -c "xvfb-run -a lxd-indicator > app.log 2>&1 &"

        result=1
        for i in $(seq 1 90); do
          if grep -q 'Successfully connected to LXD' app.log; then result=0; break; fi
          sleep 1
        done
        echo '--- Application logs ---'
        cat app.log
        echo '------------------------'
        if [ $result -ne 0 ]; then
          echo '--- Processes ---'
          ps -eo pid,ppid,stat,wchan:32,args --forest | grep -B2 -A6 -E 'lxd-indicator|xvfb' | grep -v grep
          echo '--- AppArmor denials / snap messages ---'
          sudo journalctl -b --no-pager | grep -E 'apparmor="DENIED"|snap-confine|lxd-indicator' | tail -60
        fi
        pkill -f lxd-indicator.py || true
        test $result -eq 0

    - name: Upload snap artifact
      uses: actions/upload-artifact@v6
      with:
        name: lxd-indicator-snap
        path: lxd-indicator_*.snap
