name: lxd-indicator
base: core24
version: '0.2'
title: LXD Indicator
summary: LXD instance status indicator
license: GPL-3.0-only
contact: https://github.com/ted-gould/lxd-indicator/issues
issues: https://github.com/ted-gould/lxd-indicator/issues
source-code: https://github.com/ted-gould/lxd-indicator
website: https://github.com/ted-gould/lxd-indicator
description: |
  A simple system tray indicator for displaying the status of LXD instances
  and performing basic actions.

  The indicator talks to the LXD snap's socket through the `lxd` interface,
  which is not connected automatically. After installing, run:

      sudo snap connect lxd-indicator:lxd lxd

  Your user must also be a member of the `lxd` group.
grade: stable
confinement: strict

apps:
  lxd-indicator:
    # Run the bundled Ubuntu Python explicitly. Its stdlib is found relative
    # to the binary ($SNAP/usr/lib/python3.12), so the GNOME runtime's
    # partial Python (no _ssl) is never picked up.
    command: usr/bin/python3 $SNAP/bin/lxd-indicator.py
    # The gnome extension provides the desktop launcher (GTK, GdkPixbuf
    # loaders, GSettings schemas, themes) and the desktop/x11/wayland/opengl/
    # gsettings plugs.
    extensions: [gnome]
    plugs:
      - lxd     # access to /var/snap/lxd/common/lxd/unix.socket
      - unity7  # StatusNotifierItem D-Bus API used by the tray icon
    autostart: lxd-indicator.desktop
    environment:
      PYTHONPATH: $SNAP/lib/python3/site-packages:$SNAP/usr/lib/python3/dist-packages
      # Log lines go straight to the journal/terminal instead of a buffer.
      PYTHONUNBUFFERED: '1'

parts:
  lxd-indicator:
    # Not the python plugin: with the gnome extension the SDK's python3 is
    # first on the build PATH, so the plugin's venv ends up bound to the
    # GNOME runtime's Python at run time. Install pylxd with the system
    # Python (same 3.12 ABI as the staged interpreter) instead.
    plugin: nil
    source: .
    build-packages:
      - python3-pip
    stage-packages:
      # core24 has no usable Python, but its package list still names the
      # interpreter packages, so snapcraft drops them when they're only
      # pulled in as dependencies. List them explicitly so they're staged.
      - python3
      - python3-minimal
      - python3.12
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - libssl3t64
      - libexpat1
      - libffi8
      - python3-gi
      - gir1.2-ayatanaappindicator3-0.1
      - libayatana-appindicator3-1
    override-build: |
      # The gnome extension points PYTHONPATH/LD_LIBRARY_PATH at the SDK; keep
      # them out of the host interpreter running pip.
      env -u PYTHONPATH -u LD_LIBRARY_PATH /usr/bin/python3 -m pip install --no-cache-dir --break-system-packages \
        --target "$CRAFT_PART_INSTALL/lib/python3/site-packages" \
        'pylxd>=2.4.2,<3'
      # Fail here, with context, rather than at pack time if Python is missing.
      if [ ! -e "$CRAFT_PART_INSTALL/usr/bin/python3" ]; then
        ls -l "$CRAFT_PART_INSTALL/usr/bin" || true
        echo "staged python3 interpreter missing" >&2
        exit 1
      fi
      install -D -m 755 lxd-indicator.py "$CRAFT_PART_INSTALL/bin/lxd-indicator.py"
      for icon in lxd_logo.svg lxd_logo_light.svg lxd_logo_dark.svg; do
        install -D -m 644 "$icon" "$CRAFT_PART_INSTALL/$icon"
      done
